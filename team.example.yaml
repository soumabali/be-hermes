# team.yaml — setelan tim Hermes. Anggota ada di members.yaml.
# Versi kit: `python3 hermes_team.py --version` (satu sumber: KIT_VERSION di kit_base.py; riwayat: CHANGELOG.md).
# Salin ke ~/.hermes-team/team.yaml, isi semua ID, lalu:  python3 hermes_team.py check
# Semua ID di berkas ini (1000…, 2000…, 3000…, 4000…) adalah CONTOH: `check` gagal dan `apply` menolak
# selama masih ada yang belum diganti. Key yang salah ketik dilaporkan `check` sebagai peringatan.
#
# Cara ambil ID: Discord → Settings → Advanced → Developer Mode ON, lalu klik kanan
# server / kategori / channel / user / role → "Copy ID". Tulis ID dalam tanda kutip.

team_name: Backend
guild_id: "100000000000000001"          # ID server Discord

roles:
  member: "200000000000000001"          # role @backend  (boleh pakai bot; diberikan → onboarding otomatis)
  admin: "200000000000000002"           # role @hermes-admin
  entry: "200000000000000003"           # role @entry: otomatis untuk user baru di server (opsional)

# User ID yang boleh menjalankan SEMUA slash command (/update, /restart, /model, ...) dan satu-satunya
# yang dilayani profile team-admin di #hermes-admin (tool admin: tambah anggota, bagikan skill, ganti model).
admins:
  - "300000000000000001"

# Kategori Discord tempat channel pribadi baru dibuat (onboarding / add_member). Maks 50 channel per kategori.
category_id: "400000000000000009"
channel_prefix: "hermes-"               # #hermes-andi, #hermes-budi, ...

profile_prefix: "be-"                   # profile be-andi, be-budi, ...
template_profile: be-template           # sumber clone profile pribadi

shared:
  profile: team-shared
  channel_id: "400000000000000001"      # #hermes-shared  (semua @backend, wajib @mention → thread)
  auto_skills: []                       # opsional, mis. [team-conventions] dimuat tiap sesi baru
admin:
  profile: team-admin
  channel_id: "400000000000000002"      # #hermes-admin   (hanya @hermes-admin)
  auto_skills: []

# Repo skill tim (git), dimiliki root dan READ-ONLY untuk user Linux Hermes.
team_skills_dir: /srv/hermes-team/skills
team_skills_in_personal: true

# false (disarankan): siapa pun yang bisa melihat channel pribadi dilayani profile pemiliknya
#                     (batasi lewat izin channel Discord); cron pribadi tetap bisa kirim ke channel.
# true            : hanya pemilik yang dilayani; orang lain jatuh ke lobby; cron tidak bisa kirim ke sana.
strict_personal_routes: false
# true (disarankan): #hermes-admin hanya melayani user di `admins`, walau izin channel bocor.
strict_admin_routes: true

# true = profile default (lobby, untuk pesan tanpa rute) hanya bisa membalas teks, tanpa tool.
lobby_restrict: true

# Thread per percakapan. Di channel pribadi tiap pesan BARU (bukan balasan) otomatis membuka thread baru
# = sesi baru dengan konteks sendiri; selama kamu membalas di dalam thread itu, konteksnya tetap satu.
# Memory, skill, secret, dan sandbox (/workspace) milik profile-mu sama di semua thread, jadi hal yang
# sudah dipelajari tidak hilang. false = semua pesan di channel utama berbagi satu sesi (dipotong /new).
# Mengubah ini butuh /restart sekali.
threads:
  personal: true     # channel pribadi anggota
  admin: false       # #hermes-admin tetap satu aliran (true = ikut membuat thread)

# Browser otomatis (Chromium) & computer use berjalan di server host, BUKAN di sandbox Docker,
# dan memakan RAM besar kalau 20 orang memakainya. false = dimatikan untuk semua profile.
allow_browser: false

# --------------------------------------------------------------------------- model AI
# Satu provider OpenAI-compatible (mis. gateway LLM internal) dengan beberapa model.
# API key-nya TIDAK ditulis di sini. Taruh di /etc/hermes/.env (milik root, berlaku untuk semua
# profile dan tidak bisa ditimpa user):   TD_API_KEY=...
llm:
  providers:
    td:
      api: https://llm.example.internal/v1   # base URL OpenAI-compatible
      key_env: TD_API_KEY
  models:                                    # alias → provider + nama model di endpoint
    td-normal: {provider: "custom:td", model: td-normal}
    td-simple: {provider: "custom:td", model: td-simple}
    # Ambang kompresi khusus satu model (opsional; tanpa ini → scale.compression_threshold_tokens dan
    # scale.proactive_prune_tokens). Model berjendela konteks besar boleh dipangkas lebih jarang: tiap
    # pemangkasan menulis ulang riwayat dan memutus prompt cache. Pangkas harus lebih kecil dari kompresi.
    # Ditulis `apply` ke config tiap profile sesuai modelnya; `set-model` ikut memperbaruinya.
    #   td-normal:
    #     provider: "custom:td"
    #     model: td-normal
    #     compression_threshold_tokens: 120000
    #     proactive_prune_tokens: 90000
  default_model: td-simple    # anggota tanpa `model` di members.yaml
  admin_model: td-normal      # profile team-admin
  shared_model: td-simple     # profile team-shared (#hermes-shared)
  lobby_model: td-simple      # profile default (lobby)
  aux_model: td-simple        # kompresi konteks, judul, review memory, approval, dll.
  fallback: [td-simple]       # dipakai bila model utama error/throttle (model yang sama dilewati)
  # PERHATIAN: fallback di provider yang SAMA tidak menolong saat endpoint itu membalas 429 atau mati,
  # dan anggota yang modelnya td-simple tidak punya cadangan sama sekali. `check` memberi peringatan.
  # Tambahkan provider kedua (endpoint cadangan, atau endpoint yang sama dengan key/kuota lain), mis.:
  #   providers:
  #     td:     {api: "https://llm.example.internal/v1", key_env: TD_API_KEY}
  #     backup: {api: "https://llm-backup.example.internal/v1", key_env: BACKUP_API_KEY}
  #   models:
  #     td-normal:     {provider: "custom:td", model: td-normal}
  #     td-simple:     {provider: "custom:td", model: td-simple}
  #     backup-simple: {provider: "custom:backup", model: small-model}
  #   fallback: [td-simple, backup-simple]   # urutan dicoba; taruh BACKUP_API_KEY di /etc/hermes/.env
  # Beberapa key untuk SATU endpoint: pakai credential pool Hermes (dokumentasi Hermes: credential-pools).
  per_user_keys: false        # true = tiap profile boleh punya key sendiri (hermes_team.py llm-key)

# --------------------------------------------------------------------------- sandbox
# Dipin lewat /etc/hermes/config.yaml, KECUALI cpu dan memory_mb: keduanya ditulis `apply` ke config tiap
# profile supaya bisa berbeda per orang (members.yaml → `sandbox:`, atau `hermes_team.py set-sandbox`).
# image kosong = image bawaan Hermes. Untuk tim backend pakai image
# sendiri berisi toolchain (PHP/Composer, Go, Java, Node, Python, klien DB, gh): lihat docker/sandbox/Dockerfile,
#   docker build -t hermes-team-sandbox:2026.11 docker/sandbox   →   image: "hermes-team-sandbox:2026.11"
# Pakai tag bertanggal, bukan :latest, supaya semua sandbox sama dan rollback mudah.
sandbox:
  image: ""
  cpu: 1                            # bawaan per profile (pengecualian: 0.25..64)
  memory_mb: 1024                   # bawaan per profile; plafon, bukan cadangan (pengecualian: 256..65536).
                                    # `check` menjumlahkan plafon terburuk dan memperingatkan bila > RAM server.
  # Membatasi internet sandbox — pilih salah satu:
  #  1) Proxy bawaan Hermes (disarankan): di server jalankan `hermes egress install && hermes egress setup &&
  #     hermes egress start`. Sandbox hanya memegang token proxy (kunci provider asli tetap di host) dan
  #     hanya bisa ke host yang diizinkan (proxy.extra_allowed_hosts di config host). Tidak perlu setelan di sini.
  #  2) Tanpa jaringan sama sekali: `terminal.docker_network: false` (tool yang butuh internet tidak jalan).
  #  3) Proxy sendiri (lama): isi dua baris berikut dengan jaringan Docker + URL proxy buatanmu.
  # network: hermes-sandbox
  # http_proxy: http://hermes-egress:3128

# --------------------------------------------------------------------------- skala (20 orang)
scale:
  max_concurrent_sessions: 8        # sesi anggota yang boleh berjalan bersamaan (lebih → antre)
  admin_reserved_slots: 2           # slot tambahan khusus admin, jadi admin tidak ikut antre
  user_rate_per_minute: 6           # pesan per menit per orang (0 = tanpa batas)
  user_burst: 4                     # pesan beruntun yang langsung lolos
  queue_max_wait_seconds: 180       # lama antre saat semua slot penuh sebelum pesan ditolak sopan
  agent_max_turns: 60               # langkah tool per giliran (mencegah loop tak berujung)
  goals_max_turns: 4                # batas lanjutan otomatis /goal (4 × agent_max_turns langkah dari satu pesan)
  delegation_max_children: 1        # subagent paralel per giliran (tiap subagent = satu percakapan LLM lagi)
  compression_threshold_tokens: 64000   # kompres konteks paling lambat di angka ini (bawaan; per model: llm.models)
  proactive_prune_tokens: 48000     # pangkas output tool lama tanpa LLM
  idle_compact_after_seconds: 3600  # sesi yang dibuka lagi setelah 1 jam diringkas dulu
  busy_input_mode: queue            # pesan susulan saat bot sibuk masuk antrean, tidak memotong
  title_llm: false                  # judul sesi tanpa request LLM
  # --- pembatas tambahan (docs/RENCANA-SKALA.md)
  user_max_concurrent: 2            # sesi aktif per orang (min 1); pesan berikutnya antre sampai satu selesai
  max_llm_parallel: 0               # panggilan LLM paralel seluruh tim, termasuk cron & subagent (0 = tidak dibatasi).
                                    # Isi dari keluaran:  python3 tools/probe_llm.py --team team.yaml --alias td-simple
  daily_token_budget: 0             # token per orang per hari, mis. 3000000 (0 = tanpa batas); 80% diperingatkan, 100% ditolak
  team_daily_token_budget: 0        # token seluruh tim per hari (0 = tanpa batas)
  adaptive_throttle: true           # 429 beruntun → batas sesi efektif diturunkan, lalu pulih perlahan
  allow_member_cron: false          # false = toolset cronjob mati untuk anggota & #hermes-shared (admin tetap punya)
  cron_min_interval_minutes: 15     # bila cron dibuka: jadwal lebih rapat dari ini ditolak (0 = tanpa batas)
  allow_goals: false                # false = /goal dan /subgoal tidak ada di daftar perintah bawaan anggota
  session_retention_days: 90        # sesi yang sudah berakhir & lebih tua dari ini dipangkas Hermes (0 = tidak diatur kit)

# --------------------------------------------------------------------------- pencatatan pemakaian
# usage_ledger.py memotret pemakaian token & request tiap orang ke ~/.hermes-team/state/usage.db
# (hanya angka; tanpa isi percakapan). Batas hari/minggu/bulan memakai zona waktu ini.
usage:
  timezone: ""                      # mis. "Asia/Makassar" (WITA) atau "Asia/Jakarta"; kosong = zona waktu server
  # Laporan pemakaian terjadwal, dikirim tools/usage_post.py ke channel di bawah. Jam "HH:MM" 24 jam dalam
  # zona waktu di atas dan WAJIB di dalam tanda kutip; kosong ("") atau false = laporan itu mati.
  # Jangan pakai channel pribadi anggota (laporan memuat angka semua orang) — ditolak `check`.
  report_channel_id: ""             # mis. ID #hermes-admin atau channel khusus #hermes-usage
  reports:
    daily: ""                       # mis. "08:00" → tiap hari: laporan KEMARIN
    weekly: ""                      # mis. "08:05" → tiap Senin: laporan MINGGU LALU
    monthly: ""                     # mis. "08:10" → tiap tanggal 1: laporan BULAN LALU

# --------------------------------------------------------------------------- secret (/env-set)
secrets:
  max_keys: 40                      # per profile
  min_length: 6                     # nilai lebih pendek ditolak (tidak bisa disamarkan dengan aman)
  scrub_chat: true                  # kredensial yang diketik di chat disamarkan sebelum sampai ke AI
  delete_secret_messages: true      # dan pesan aslinya dihapus (bot butuh Manage Messages)
  block_env_dump: true              # blokir env/printenv/set/echo $SECRET di terminal
  hint: true                        # beri tahu AI NAMA secret yang tersedia (bukan nilainya)
  allow_names: []                   # pengecualian nama yang biasanya dilarang
  deny_names: []                    # nama tambahan yang dilarang

# --------------------------------------------------------------------------- onboarding otomatis
# User baru masuk server → role entry. Admin memberi @backend → bot membuat channel privat
# #hermes-<username>, profile be-<username> (memory, .env, sandbox sendiri), rute gateway, lalu
# mengirim pesan sambutan yang me-mention orangnya. Role @backend dicabut / user keluar → dinonaktifkan.
onboarding:
  enabled: true
  give_entry_role: true             # butuh roles.entry
  remove_entry_role: true           # role entry dicabut setelah onboarding selesai
  verify_actor: true                # @backend harus diberikan admin tim / pemilik server / bot ini (audit log;
                                    # bot butuh izin View Audit Log). Lainnya → ditahan, admin diberi tahu.
  trusted_actor_ids: []             # bot lain yang boleh memberi @backend (mis. bot verifikasi)
  offboard_on_role_remove: true     # @backend dicabut / keluar server → anggota dinonaktifkan (data tetap)
  hide_channel_on_offboard: true    # sekaligus cabut izin melihat channel pribadinya
  entry_role_on_offboard: true      # yang masih di server kembali mendapat role entry
  reconcile_minutes: 10             # susulan berkala untuk perubahan role saat bot offline (0 = mati)
  admin_notices: true               # kabar onboarding di #hermes-admin
  # Placeholder: {mention} {display_name} {name} {team_name} {model} {channel} {shared_channel}
  #              {admin_channel} {profile}. Kosongkan baris di bawah untuk memakai teks bawaan.
  # welcome_message: |
  #   Halo {mention}, selamat datang di tim {team_name}! 👋
  #   Ini ruang kerja Hermes pribadimu. Tulis langsung di sini; simpan token dengan /env-set.
  #   Skill & konteks tim ada di {shared_channel}. Model AI-mu: {model}.
  # welcome_back_message: "Halo lagi {mention}, ruang kerja Hermes-mu aktif kembali."

# Rute & channel baru diterapkan plugin ke gateway yang sedang jalan, tanpa restart.
live_reload: true
# Kalau live reload gagal (mis. versi Hermes baru mengubah internal gateway):
#   idle   = restart halus otomatis saat tidak ada sesi aktif (sesi berjalan tidak diputus)
#   manual = admin diberi tahu untuk mengetik /restart
restart_fallback: idle

# --------------------------------------------------------------------------- kelola server Discord
# Tool discord_* di #hermes-admin (selalu dengan tombol konfirmasi).
server_admin:
  enabled: true
  allow_moderation: true            # timeout & kick (ban selalu manual)
  allow_elevated_permissions: false # izin tinggi (Administrator, Manage Roles/Channels/Server, ban/kick, …)
  read_messages: true               # baca pesan channel non-pribadi (channel pribadi anggota selalu ditolak)

# Opsional — perintah slash yang boleh dipakai anggota non-admin (tanpa garis miring).
# Kosongkan untuk memakai daftar bawaan (tanpa /model, /moa, /reasoning, /tools, /config, ...;
# /goal dan /subgoal hanya ikut bila scale.allow_goals: true). Daftar yang ditulis di sini selalu menang.
# user_allowed_commands: [new, reset, retry, undo, status, stop, thread, usage]

# Opsional — rute tambahan, mis. satu thread khusus diberi "otak" sendiri.
