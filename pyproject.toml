[project]
name = "hermes-team-kit"
dynamic = ["version"]
description = "Kit tim untuk Hermes Agent: satu bot Discord, satu gateway, satu profile per orang."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "discord.py>=2.4"]

# Kit TIDAK dipasang dengan `pip install`: ia dipasang dengan menyalin folder ini ke /opt/hermes-team
# (root-owned) oleh `setup.sh`, dan dijalankan sebagai skrip. Berkas ini hanya memuat metadata dan
# konfigurasi alat pengembangan; `VERSION` adalah satu-satunya sumber nomor versi.
[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:discord.*"]

# Lint konservatif (CI job `lint`): galat sintaks + pyflakes dasar. Bukan pemformat dan bukan aturan gaya.
[tool.ruff]
extend-exclude = ["arsip-versi-lama"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
# `_DIR` dipakai `_read()` saat impor lalu di-`del` di akhir modul: ruff mengiranya nama tak dikenal (positif palsu).
"kit/templates/__init__.py" = ["F821"]
