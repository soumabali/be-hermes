name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"   # mingguan: deteksi dini perubahan Hermes yang merusak kit
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Ref hermes-agent untuk uji integrasi (kosong = pakai HERMES_REF di bawah)"
        required: false

permissions:
  contents: read

env:
  # Versi Hermes yang dipakai tim. Naikkan lewat PR setelah uji integrasi hijau,
  # baru jalankan `hermes update` di server.
  HERMES_REF: 5d87ea2242c7e5a4ce76098b6113f04bf11348c6

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  integration:
    # Uji yang butuh Hermes asli (resolver rute, loader plugin, daftar toolset/config). Hermes dipasang
    # dengan uv dari lockfile-nya sendiri: pip biasa tidak bisa menyelesaikan dependensinya.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes: [pinned, main]
    continue-on-error: ${{ matrix.hermes == 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes == 'main' && 'main' || (inputs.hermes_ref || env.HERMES_REF) }}
          path: .hermes-src
      - uses: astral-sh/setup-uv@v5
      - name: Pasang Hermes (uv, lockfile upstream)
        working-directory: .hermes-src
        run: |
          uv sync --frozen --extra discord --python 3.14
          uv pip install --python .venv/bin/python -r ../requirements-dev.txt
      - name: Hermes bisa di-import
        run: .hermes-src/.venv/bin/python -c "import gateway, toolsets, hermes_cli.plugins; print('ok')"
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-src
      - name: Uji (integrasi tidak boleh dilewati)
        run: .hermes-src/.venv/bin/python -m pytest tests -q -rs -p no:cacheprovider
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-src
          KIT_REQUIRE_HERMES: "1"
          HERMES_SOURCE_DIR: ${{ github.workspace }}/.hermes-src   # uji drift nama env /env-set
